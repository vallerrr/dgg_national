# Pinned from the working `dgg_research` env on 2026-08-02 (CONVENTIONS.md §5).
#   mamba env create -f environment.yml
#   mamba activate dgg_research
name: dgg_research
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas=2.3.3
  - numpy=2.4.1
  - geopandas=1.1.2
  - shapely=2.1.2
  - scikit-learn=1.8.0
  - statsmodels=0.14.6
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - joblib=1.5.3
  - openpyxl=3.1.5
  - jupyterlab
  - pip
  - pip:
      - pycountry==26.2.16
      - pycountry-convert==0.7.2
